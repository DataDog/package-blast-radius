name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  pull-requests: read

jobs:
  goreleaser:
    # duckdb-go links a prebuilt, platform-specific static libduckdb via CGO,
    # so all 4 targets are built here rather than cross-compiled from Linux:
    # Xcode's clang builds both darwin/amd64 and darwin/arm64, and the
    # messense/macos-cross-toolchains GNU toolchains build both linux/amd64
    # and linux/arm64 with a real libstdc++ (see .goreleaser.yaml).
    runs-on: macos-14
    permissions:
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # ratchet:step-security/harden-runner@v2
        with:
          egress-policy: audit

      # The org blocks GITHUB_TOKEN from creating pull requests, so the
      # write-scoped token used below (for goreleaser's release + Homebrew PR)
      # comes from dd-octo-sts-action instead. Trust policy:
      # .github/chainguard/self.release.create-pr.sts.yaml
      - name: Federate GitHub App token
        uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # ratchet:DataDog/dd-octo-sts-action@v1.0.4
        id: octo-sts
        with:
          scope: DataDog/package-blast-radius
          policy: self.release.create-pr

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Linux cross-toolchains
        run: |
          brew tap messense/macos-cross-toolchains
          brew trust messense/macos-cross-toolchains
          brew install x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # ratchet:goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
